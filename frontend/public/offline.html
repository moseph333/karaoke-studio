<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b12" />
    <title>Karaoke Studio · Offline</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0b12;
        color: #f5f3ff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 24px
          calc(24px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        max-width: 26rem;
        color: #a8a5c7;
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        margin-top: 8px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #7c3aed, #c026d3 52%, #db2777);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #a78bfa;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>Can't reach your studio</h1>
      <p>
        Karaoke Studio runs on your own server, and it isn't answering right now. Check your
        connection, or wait a minute if the server is restarting after an update.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself once the connection returns
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
