<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="application-name" content="Karaoke Studio" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Karaoke" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Karaoke Studio</title>
    <meta
      name="description"
      content="Turn any song into karaoke: word-by-word synced lyrics, a clean instrumental, key control and 1080p video exports."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Karaoke Studio" />
    <meta property="og:title" content="Karaoke Studio: turn any song into karaoke" />
    <meta
      property="og:description"
      content="Word-by-word synced lyrics, a clean instrumental, key control and 1080p video exports."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Boot shell: the top bar and a quiet outline of the home screen, painted from this file
         alone while the app's script loads. React replaces it when it mounts. Colours come
         from the token variables in the stylesheet, with the same values as fallback. Its
         wordmark is set in the display face, which starts that font file downloading alongside
         the script, so the capitals do not flash in a fallback face when the app appears. -->
    <style>
      .boot-bar {
        display: flex;
        align-items: center;
        /* Under a see-through status bar (installed app) the bar starts below it, as the
           app's header does */
        box-sizing: content-box;
        height: 3.5rem;
        padding: env(safe-area-inset-top, 0px) 16px 0;
        border-bottom: 2px solid var(--theme-border, #f2eee3);
        font: 900 1.625rem/1
          var(--theme-font-display, 'Sofia Sans Extra Condensed', 'Arial Narrow', sans-serif);
        letter-spacing: 0.005em;
        text-transform: uppercase;
      }
      .boot-page {
        display: grid;
        gap: 20px;
        max-width: 96rem;
        margin: 0 auto;
        padding: 20px 16px;
      }
      /* The headline, then the search field */
      .boot-block {
        background: var(--theme-surface-subtle, #141413);
        animation: boot-pulse 1.4s ease-in-out infinite alternate;
      }
      .boot-block.a {
        height: 26vw;
        max-height: 22rem;
      }
      .boot-block.b {
        height: 4.25rem;
      }
      @keyframes boot-pulse {
        from {
          opacity: 0.45;
        }
        to {
          opacity: 0.9;
        }
      }
      @media (min-width: 640px) {
        .boot-bar {
          padding: env(safe-area-inset-top, 0px) 32px 0;
          font-size: 1.875rem;
        }
        .boot-page {
          gap: 32px;
          padding: 32px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-block {
          animation: none;
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body
    class="min-h-screen"
    style="
      background-color: var(--theme-bg);
      color: var(--theme-text);
      font-family: var(--theme-font-body);
    "
  >
    <div id="root">
      <div aria-hidden="true">
        <div class="boot-bar">Karaoke Studio</div>
        <div class="boot-page">
          <div class="boot-block a"></div>
          <div class="boot-block b"></div>
        </div>
      </div>
    </div>
    <noscript>Karaoke Studio needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
